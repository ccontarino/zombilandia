<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14101f">
<title>Zombilandia · platformer de zombies</title>
<meta name="description" content="Saltá sobre los zombis, juntá cerebros y llegá a la bandera. Juego web de plataformas.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14101f">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314101f'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%237fbf5a'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%23fff'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%23fff'/%3E%3Crect x='5' y='10' width='6' height='1' fill='%23222'/%3E%3C/svg%3E">
<style>
  :root { --bg:#14101f; --ink:#f3efe6; --green:#7fbf5a; --red:#d6453d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  canvas { width:100%; max-width:calc((100vh - 140px) * 2); aspect-ratio: 2 / 1; image-rendering: auto; background:#1d1730; display:block; border-bottom:2px solid #2b2342; }
  #pad { display:flex; justify-content:space-between; width:100%; max-width:640px; padding:14px 16px 6px; gap:12px; }
  #pad .grp { display:flex; gap:12px; }
  #pad button { width:min(var(--pad, 76px), 22vw); height:min(var(--pad, 76px), 22vw); border:2px solid #4a3e6b; background:#251d3d; color:var(--ink); font:700 28px/1 ui-monospace, monospace; border-radius:6px; touch-action:none; }
  #pad button.on { background:#3b2f60; transform:scale(.96); }
  @media (hover:hover) and (pointer:fine) { #pad { display:none; } canvas { max-width: calc((100vh - 24px) * 2); } }
  #opts { position:absolute; top: calc(env(safe-area-inset-top) + 6px); right: 8px; display:flex; gap:6px; z-index:2; }
  #opts button { width:34px; height:34px; border:1px solid #4a3e6b; background:#251d3dcc; color:var(--ink); font:700 16px/1 ui-monospace, monospace; border-radius:6px; }
  #nm { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#07051acc; z-index:5; }
  #nm[hidden] { display:none; }
  #nm div { background:#1d1730; border:2px solid #f2c94c; border-radius:8px; padding:18px; text-align:center; }
  #nm p { margin:0 0 12px; color:#f2c94c; font-weight:700; }
  #nm input { width:120px; font:700 28px ui-monospace, monospace; text-align:center; text-transform:uppercase; letter-spacing:6px; background:#07051a; color:var(--ink); border:1px solid #4a3e6b; border-radius:6px; padding:6px; }
  #nm button { display:block; margin:12px auto 0; font:700 16px ui-monospace, monospace; padding:10px 18px; background:#7cc456; color:#07051a; border:0; border-radius:6px; }
  #sh { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#07051acc; z-index:5; }
  #sh[hidden] { display:none; }
  #sh div { background:#1d1730; border:2px solid #7cc456; border-radius:8px; padding:16px; width:min(92vw, 420px); text-align:center; }
  #sh p { margin:0 0 10px; color:#7cc456; font-weight:700; }
  #sh input { width:100%; font:12px ui-monospace, monospace; background:#07051a; color:var(--ink); border:1px solid #4a3e6b; border-radius:6px; padding:8px; }
  #sh button { margin:10px 4px 0; font:700 14px ui-monospace, monospace; padding:9px 14px; background:#251d3d; color:var(--ink); border:1px solid #4a3e6b; border-radius:6px; }
  #cfg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#07051acc; z-index:6; }
  #cfg[hidden] { display:none; }
  #cfg > div { max-height:92vh; overflow:auto; background:#1d1730; border:2px solid #7cc456; border-radius:10px; padding:14px; width:min(94vw, 400px); }
  #cfg p { margin:0 0 10px; text-align:center; color:#7cc456; font-weight:700; letter-spacing:2px; }
  #cfg .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 0; font-size:13px; }
  #cfg .seg { display:flex; gap:4px; }
  #cfg .seg button, #cfg .acts button { font:700 12px ui-monospace, monospace; padding:8px 10px; background:#251d3d; color:var(--ink); border:1px solid #4a3e6b; border-radius:6px; }
  #cfg .seg button.on { background:#3d6a2a; border-color:#7cc456; }
  #cfg input { user-select:text; -webkit-user-select:text; width:100%; font:11px ui-monospace, monospace; background:#07051a; color:var(--ink); border:1px solid #4a3e6b; border-radius:6px; padding:7px; margin-top:6px; }
  #cfg .acts { display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  #cfg #cfgClose { background:#3d6a2a; border-color:#7cc456; }
  #cfgAch { font-size:11px; margin-top:8px; border-top:1px solid #3a2f60; padding-top:8px; } #cfgAch div { margin:3px 0; opacity:.65; } #cfgAch div.ok { opacity:1; color:#f2c94c; } #cfgAch small { display:block; color:#cfc8e8; opacity:.8; }
  #cfg .seg button:disabled { opacity:.45; }
  #cfg .msg { font-size:11px; min-height:14px; text-align:center; color:#cfc8e8; margin-top:6px; }
  #on { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#07051acc; z-index:5; }
  #on[hidden] { display:none; }
  #on > div { background:#1d1730; border:2px solid #7cc456; border-radius:8px; padding:16px; width:min(92vw, 380px); text-align:center; }
  #on p { margin:0 0 10px; color:#7cc456; font-weight:700; }
  #on .or { margin:10px 0 6px; font-size:12px; opacity:.7; }
  #on .cod { font:700 34px ui-monospace, monospace; letter-spacing:8px; color:#f2c94c; margin-bottom:8px; }
  #on .msg { margin:10px 0 0; font-size:12px; min-height:16px; color:#cfc8e8; }
  #on input { width:100%; font:700 18px ui-monospace, monospace; text-align:center; text-transform:uppercase; background:#07051a; color:var(--ink); border:1px solid #4a3e6b; border-radius:6px; padding:8px; }
  #on #onLink { font:11px ui-monospace, monospace; text-transform:none; }
  #on button { margin:8px 4px 0; font:700 14px ui-monospace, monospace; padding:10px 14px; background:#251d3d; color:var(--ink); border:1px solid #4a3e6b; border-radius:6px; }
  #on #onResume { background:#6a4a10; border-color:#f2c94c; display:block; width:100%; }
  #on #onResume[hidden] { display:none; }
  #on #onCrear, #on #onUnir { background:#3d6a2a; border-color:#7cc456; }
  #on button[hidden], #on div[hidden] { display:none; }
  #ed { display:none; width:100%; max-width:960px; padding:6px 8px 0; }
  body.editing #ed { display:block; }
  body.editing #pad .grp:last-child { visibility:hidden; }
  body.editing #hint { display:none; }
  #edTools, #edActs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  #ed button { flex:0 0 auto; font:700 12px ui-monospace, monospace; padding:9px 10px; background:#251d3d; color:var(--ink); border:1px solid #4a3e6b; border-radius:6px; }
  #ed button.on { background:#f2c94c; color:#07051a; border-color:#f2c94c; }
  #edPlay { background:#3d6a2a !important; }
  @media (hover:hover) and (pointer:fine) { body.editing #pad { display:flex; justify-content:center; } body.editing #pad .grp:last-child { display:none; } }
  #hint { position:absolute; bottom:6px; font-size:12px; opacity:.55; display:none; }
  @media (hover:hover) and (pointer:fine) { #hint { display:block; } }
</style>
</head>
<body>
<div id="sh" hidden><div><p>Link de tu nivel</p><input id="shIn" readonly><button id="shCopy">Copiar</button><button id="shShare" hidden>Compartir</button><button id="shClose">Cerrar</button></div></div>
<div id="nm" hidden><div><p>¡Nuevo récord! Tus iniciales:</p><input id="nmIn" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="nmOk">Guardar</button></div></div>
<div id="on" hidden><div>
  <p>Jugar online (2 jugadores)</p>
  <div id="onMenu"><button id="onResume" hidden></button><button id="onCrear">Crear sala</button><div class="or">o entrá con un código</div><input id="onCod" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="onUnir">Unirme</button></div>
  <div id="onSala" hidden><div class="cod" id="onCode"></div><input id="onLink" readonly><button id="onCopy">Copiar link</button><button id="onShare" hidden>Compartir</button></div>
  <div id="onMsg" class="msg"></div>
  <button id="onLeave" hidden>Salir de la sala</button><button id="onClose">Cerrar</button>
</div></div>
<div id="wrap">
  <div id="opts"><button id="cfgBtn" aria-label="Ajustes (P)" title="Ajustes (P)">⚙</button><button id="menu" aria-label="Volver al menú (Esc)" title="Volver al menú (Esc)">⌂</button><button id="online" aria-label="Jugar online con un amigo" title="Jugar online">👥</button><button id="edit" aria-label="Editor de niveles (E)" title="Editor de niveles (E)">✎</button><button id="vib" aria-label="Vibración" title="Vibración">📳</button><button id="mus" aria-label="Música (M)" title="Música (M)">♪</button></div>
  <canvas id="c" width="480" height="240"></canvas>
  <div id="ed"><div id="edTools"></div><div id="edActs"><button id="edTheme">Tema</button><button id="edPlay">▶ Probar</button><button id="edShare">Compartir</button><button id="edClear">Limpiar</button><button id="edExit">Salir</button></div></div>
  <div id="pad">
    <div class="grp"><button data-k="left" aria-label="Izquierda">◀</button><button data-k="right" aria-label="Derecha">▶</button></div>
    <div class="grp"><button data-k="fire" aria-label="Rayo láser">⚡</button><button data-k="jump" aria-label="Saltar">▲</button></div>
  </div>
  <div id="hint">← → o A D para moverte · Espacio o ↑ para saltar (dos veces = doble salto) · X o F para el rayo · Esc menú · M música · E editor</div>
</div>
<div id="cfg" hidden><div><p>AJUSTES</p>
  <div class="row"><span>Dificultad</span><span class="seg" data-k="diff"><button data-v="0">Fácil</button><button data-v="1">Normal</button><button data-v="2">Difícil</button></span></div>
  <div class="row"><span>Botones</span><span class="seg" data-k="pad"><button data-v="0">Chicos</button><button data-v="1">Medios</button><button data-v="2">Grandes</button></span></div>
  <div class="row"><span>Gráficos</span><span class="seg" data-k="gfx"><button data-v="auto">Auto</button><button data-v="alto">Alto</button><button data-v="bajo">Bajo</button></span></div>
  <div class="row"><span>Música</span><span class="seg" data-k="mus"><button data-v="0">No</button><button data-v="1">Sí</button></span></div>
  <div class="row"><span>Progreso</span><span class="seg"><button id="cfgExp">Copiar código</button><button id="cfgImp">Cargar</button></span></div>
  <div class="row"><span>Personaje</span><span class="seg" data-k="hero"><button data-v="0">Chispa</button><button data-v="1">Escarcha</button></span></div>
  <div class="row"><span>Traje</span><span class="seg" id="cfgSkin"></span></div>
  <input id="cfgCode" placeholder="Código de progreso (pegalo acá)" autocomplete="off">
  <div class="msg" id="cfgMsg"></div>
  <div id="cfgAch"></div>
  <div class="acts"><button id="cfgMenu">Volver al menú</button><button id="cfgClose">Seguir</button></div></div></div>
<script src="art.js?v=59"></script>
<script src="chars.js?v=59"></script>
<script src="game.js?v=59"></script>
<script src="net.js?v=59"></script>
<script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js?v=59").catch(() => {});</script>
</body>
</html>
